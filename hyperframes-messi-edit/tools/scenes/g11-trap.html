.g11-h { position:absolute; left: 70px; right: 70px; top: 730px; text-align: center; font-weight: 900; font-size: 100px; line-height: 1.12; }
<!--/STYLE-->
    <div id="g11-print" class="print"><span class="tape"></span><img id="g11-ph" src="assets/photos/p5-trap.jpg" alt="" style="object-position:40% 55%" data-color-grading='{{grade}}'></div>
    <div id="g11-h1" class="g11-h"><span class="mask"><span class="in">بيمشي <span class="warm">ببطء</span></span></span></div>
    <div id="g11-h2" class="g11-h"><span class="mask"><span class="in">المدافع <span class="soft">يقرب منه</span></span></span></div>
    <div id="g11-h3" class="g11-h"><span class="mask"><span class="in">وبيحس <span class="sky">بالأمان</span></span></span></div>
    <svg id="g11-svg" viewBox="0 0 1080 1920" width="1080" height="1920" style="left:0;top:0" aria-hidden="true">
      <path id="g11-line" d="M120 1300 H960" stroke="#5A5C5E" stroke-width="3" opacity=".5" fill="none" pathLength="100" stroke-dasharray="100 120" />
      <g id="g11-steps" fill="#E66A21" opacity=".75">
        <ellipse cx="900" cy="1150" rx="11" ry="18" transform="rotate(90 900 1150)" /><ellipse cx="850" cy="1170" rx="11" ry="18" transform="rotate(90 850 1170)" />
        <ellipse cx="800" cy="1150" rx="11" ry="18" transform="rotate(90 800 1150)" /><ellipse cx="750" cy="1170" rx="11" ry="18" transform="rotate(90 750 1170)" />
      </g>
      <g id="g11-messi"><circle cx="680" cy="1160" r="38" fill="#E66A21" /><text x="680" y="1173" text-anchor="middle" font-family="Cairo" font-weight="900" font-size="36" fill="#FFFDF7">10</text></g>
      <circle id="g11-ball" cx="628" cy="1196" r="13" fill="#1B1D1E" />
      <path id="g11-appr" d="M200 1160 H400 M372 1140 L404 1160 L372 1180" stroke="#5A5C5E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" pathLength="100" stroke-dasharray="100 120" />
      <circle id="g11-safe" cx="470" cy="1160" r="96" fill="#75AADB" fill-opacity=".16" stroke="#75AADB" stroke-width="5" stroke-dasharray="12 10" />
      <g id="g11-def"><circle cx="230" cy="1160" r="32" fill="#E9E0D3" stroke="#1B1D1E" stroke-width="7" /></g>
    </svg>
  <script>
  snapIn("#g11-print", 0, -1.5);
  draw("#g11-line", 0, 0.5);
  pop("#g11-messi", 0);
  pop("#g11-ball", 0.05);
  pop("#g11-def", 0.05);
  rise("#g11-h1 .in", 0);
  tl.fromTo("#g11-steps ellipse", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out", stagger: 0.22 }, {{k:g11_walk}});
  tl.fromTo("#g11-messi", { x: 50 }, { x: 0, duration: 1.0, ease: "sine.inOut" }, {{k:g11_walk}});
  bout("#g11-h1", {{k:g11_lets}} - 0.12);
  rise("#g11-h2 .in", {{k:g11_lets}});
  draw("#g11-appr", {{k:g11_near}} - 0.05, 0.4);
  tl.fromTo("#g11-def", { x: 0 }, { x: 240, duration: 0.9, ease: "power2.inOut" }, {{k:g11_near}});
  bout("#g11-h2", {{k:g11_feels}} - 0.12);
  rise("#g11-h3 .in", {{k:g11_feels}});
  tl.fromTo("#g11-safe", { opacity: 0, scale: 0.4, svgOrigin: "470 1160" }, { opacity: 1, scale: 1, svgOrigin: "470 1160", duration: 0.5, ease: "expo.out" }, {{k:g11_safe}});
  </script>
