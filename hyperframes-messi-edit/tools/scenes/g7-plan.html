<!--STYLE-->
#g7-k { top: 290px; font-size: 64px; font-weight: 800; }
#g7-h { top: 376px; font-size: 150px; }
#g7-sub { top: 600px; font-size: 62px; font-weight: 800; color: var(--ink-soft); }
<!--/STYLE-->
    <div id="g7-k" class="kicker"><span class="w">بينفذ</span></div>
    <div id="g7-h" class="hero"><span class="mask"><span class="in">خطة <span class="warm">هندسية</span></span></span></div>
    <div id="g7-sub" class="hero"><span class="w">رسمها</span> <span class="w">في</span> <span class="w">دماغه</span></div>
    <svg id="g7-svg" viewBox="0 0 1080 1920" width="1080" height="1920" style="left:0;top:0" aria-hidden="true">
      <g fill="none" stroke="#5A5C5E" stroke-width="3" opacity=".5">
        <path id="g7-frame" d="M120 720 H960 V1400 H120 Z" pathLength="100" stroke-dasharray="100 120" />
        <path id="g7-grid" d="M120 890 H960 M120 1060 H960 M120 1230 H960 M330 720 V1400 M540 720 V1400 M750 720 V1400" pathLength="100" stroke-dasharray="100 120" opacity=".6" />
      </g>
      <defs><mask id="g7-mp"><path id="g7-mpath" d="M860 1320 C 760 1250, 700 1100, 600 1060 S 380 1000, 300 860" stroke="#fff" stroke-width="22" fill="none" pathLength="100" stroke-dasharray="100 120" /></mask></defs>
      <path d="M860 1320 C 760 1250, 700 1100, 600 1060 S 380 1000, 300 860" stroke="#75AADB" stroke-width="8" stroke-dasharray="18 14" stroke-linecap="round" fill="none" mask="url(#g7-mp)" />
      <g fill="#E9E0D3" stroke="#1B1D1E" stroke-width="6">
        <circle id="g7-d1" cx="700" cy="1180" r="24" /><circle id="g7-d2" cx="520" cy="1110" r="24" /><circle id="g7-d3" cx="380" cy="960" r="24" />
      </g>
      <path id="g7-exec" d="M860 1320 C 760 1250, 700 1100, 600 1060 S 380 1000, 300 860" stroke="#E66A21" stroke-width="10" stroke-linecap="round" fill="none" pathLength="100" stroke-dasharray="100 120" />
      <g id="g7-dot"><circle cx="860" cy="1320" r="34" fill="#E66A21" /><text x="860" y="1332" text-anchor="middle" font-family="Cairo" font-weight="900" font-size="32" fill="#FFFDF7">10</text></g>
      <g id="g7-x" stroke="#1B1D1E" stroke-width="7" stroke-linecap="round"><path d="M280 840 L320 880 M320 840 L280 880" /></g>
    </svg>
  <script>
  draw("#g7-frame", 0, 0.5);
  draw("#g7-grid", 0.1, 0.5);
  pop("#g7-dot", 0);
  tl.fromTo(["#g7-d1", "#g7-d2", "#g7-d3"], { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "expo.out", stagger: 0.08 }, 0.05);
  bin("#g7-k .w", 0);
  rise("#g7-h .in", {{k:g7_plan}});
  // the plan is drawn first (dashed sky), then executed exactly on top of it (solid orange)
  draw("#g7-mpath", {{k:g7_plan}}, 0.7, "power2.inOut");
  pop("#g7-x", {{k:g7_plan}} + 0.65, 0.2);
  [1, 2, 3].forEach((i) => bin(`#g7-sub .w:nth-child(${i})`, {{k:g7_drew}} + (i - 1) * 0.12));
  draw("#g7-exec", {{k:g7_head}}, 0.55, "power3.inOut");
  tl.fromTo("#g7-dot", { x: 0, y: 0 }, { x: -560, y: -460, duration: 0.55, ease: "power3.inOut", immediateRender: false }, {{k:g7_head}});
  </script>
